[Service]
# A cold torrent takes ten to twenty seconds before its first byte, and a probe
# window that short always loses, so the addon used to answer nothing. The
# addon warms the swarm first now; these keep the fallback probes cheap.
Environment=STREAM_PROBE_MS=2500
Environment=STREAM_PROBES=6
Environment=PROBE_DEADLINE_MS=6000
Environment=LIVE_WINDOW_MS=4000
